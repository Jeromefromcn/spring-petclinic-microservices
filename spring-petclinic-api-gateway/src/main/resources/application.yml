spring:
  application:
    name: api-gateway
  config:
    import: "optional:consul:"
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
    gateway:
      server:
        webflux:
          default-filters:
            - name: CircuitBreaker
              args:
                name: defaultCircuitBreaker
                fallbackUri: forward:/fallback
          routes:
            - id: vets-service
              uri: ${petclinic.services.vets-url}
              predicates:
                - Path=/api/vet/**
              filters:
                - StripPrefix=2
            - id: visits-service
              uri: ${petclinic.services.visits-url}
              predicates:
                - Path=/api/visit/**
              filters:
                - StripPrefix=2
            - id: customers-service
              uri: ${petclinic.services.customers-url}
              predicates:
                - Path=/api/customer/**
              filters:
                - StripPrefix=2
  reactor:
    context-propagation: auto
  messages:
    basename: messages/messages
# Downstream base URLs: K8s Service DNS. Load balancing, retries and
# circuit breaking between services belong to the mesh (Envoy), not to a
# client-side load balancer.
petclinic:
  services:
    customers-url: http://customers-service:8081
    visits-url: http://visits-service:8082
    vets-url: http://vets-service:8083
server:
  port: 8080
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,text/css,application/javascript
    min-response-size: 2048
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1
logging:
  level:
    org.springframework: INFO
---
spring:
  config:
    activate:
      on-profile: docker
  cloud:
    consul:
      host: consul
      port: 8500
management:
  tracing:
    export:
      zipkin:
        endpoint: "http://jaeger:9411/api/v2/spans"

---
spring:
  config:
    activate:
      on-profile: chaos-monkey
management:
  endpoint:
    chaosmonkey:
      enabled: true
chaos:
  monkey:
    enabled: true
    watcher:
      component: false
      controller: false
      repository: false
      rest-controller: false
      service: false
