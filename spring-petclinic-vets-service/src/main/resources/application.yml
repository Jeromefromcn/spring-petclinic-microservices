spring:
  application:
    name: vets-service
  config:
    import: "optional:consul:"
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
    refresh:
      never-refreshable: dataSource,com.zaxxer.hikari.HikariDataSource
  cache:
    cache-names: vets
  profiles:
    active: production
  # `data.` prefix is not a typo: Spring Cloud Consul Config (KEY_VALUE format) derives
  # property names from the KV path relative to `config/<service>/`, so the KV key
  # `config/<service>/data/db.host` becomes the property `data.db.host`.
  datasource:
    url: jdbc:postgresql://${data.db.host}:${data.db.port}/${data.db.name}
    username: ${data.db.user}
    password: ${data.db.password}
  sql:
    init:
      schema-locations: classpath*:db/postgresql/schema.sql
      data-locations: classpath*:db/postgresql/data.sql
      mode: always
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
server:
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1
logging:
  level:
    org.springframework: INFO

---
spring:
  config:
    activate:
      on-profile: docker
  cloud:
    consul:
      host: consul
      port: 8500
server:
  port: 8083
management:
  tracing:
    export:
      zipkin:
        endpoint: "http://tracing-server:9411/api/v2/spans"

---
spring:
  config:
    activate:
      on-profile: chaos-monkey
management:
  endpoint:
    chaosmonkey:
      enabled: true
chaos:
  monkey:
    enabled: true
    watcher:
      component: false
      controller: false
      repository: false
      rest-controller: false
      service: false

